<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Path — a mini finance game</title>
<style>
  :root {
    --bg:#0b0f17; --panel:#151b26; --panel-2:#1d2533; --border:#2b3445;
    --text:#e9eef6; --muted:#8d9bb0; --green:#3fdd7a; --red:#ff6b6b;
    --blue:#5aa9ff; --gold:#ffd24a; --accent:#8b6bff; --accent2:#00d4ff;
  }
  * { box-sizing:border-box; }
  html,body { margin:0; }
  body {
    background:
      radial-gradient(1000px 500px at 15% -10%, #20284a 0%, transparent 55%),
      radial-gradient(900px 500px at 95% 0%, #133040 0%, transparent 50%),
      var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh; padding:14px; -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:800px; margin:0 auto; }
  header.app { text-align:center; margin:10px 0 14px; position:relative; }
  header.app h1 {
    margin:0; font-size:34px; letter-spacing:-1px; font-weight:800;
    background:linear-gradient(90deg,#8b6bff,#00d4ff,#3fdd7a);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  header.app p { margin:3px 0 0; color:var(--muted); font-size:13px; }
  #mute { position:absolute; right:0; top:0; width:auto; padding:6px 10px; font-size:14px; background:var(--panel-2); }

  .progress-wrap { margin:0 0 12px; display:none; }
  .progress-track { height:8px; background:var(--panel-2); border-radius:99px; overflow:hidden; border:1px solid var(--border); }
  .progress-fill { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .5s ease; }

  .hud {
    display:grid; grid-template-columns:repeat(4,1fr); gap:8px;
    background:linear-gradient(180deg,var(--panel),#121826); border:1px solid var(--border);
    border-radius:16px; padding:12px; margin-bottom:14px; box-shadow:0 8px 30px rgba(0,0,0,.35);
  }
  .hud .stat { text-align:center; padding:2px; }
  .hud .stat .label { font-size:10px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); }
  .hud .stat .value { font-size:19px; font-weight:800; margin-top:2px; font-variant-numeric:tabular-nums; }
  .bar { height:7px; background:#0d1320; border-radius:4px; overflow:hidden; margin-top:6px; }
  .bar > span { display:block; height:100%; background:linear-gradient(90deg,#ff6b6b,#ffd24a,#3fdd7a); transition:width .45s; }

  .card {
    background:linear-gradient(180deg,var(--panel),#121826); border:1px solid var(--border);
    border-radius:18px; padding:22px; margin-bottom:14px; box-shadow:0 10px 40px rgba(0,0,0,.4);
    animation:pop .28s cubic-bezier(.2,.7,.3,1);
  }
  @keyframes pop { from{transform:translateY(10px) scale(.99); opacity:0;} to{transform:none; opacity:1;} }
  .shake { animation:shake .4s; }
  @keyframes shake { 0%,100%{transform:none} 20%{transform:translateX(-8px)} 40%{transform:translateX(7px)} 60%{transform:translateX(-5px)} 80%{transform:translateX(4px)} }
  .card h2 { margin:0 0 4px; font-size:21px; }
  .card .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }

  .event { border-left:3px solid var(--accent); background:var(--panel-2); padding:12px 14px; border-radius:10px; margin-bottom:14px; font-size:14px; line-height:1.5; }
  .event.good { border-color:var(--green); } .event.bad { border-color:var(--red); }
  .amt { font-weight:800; font-variant-numeric:tabular-nums; }
  .amt.pos { color:var(--green); } .amt.neg { color:var(--red); }

  .advisor { display:flex; gap:10px; align-items:flex-start; background:rgba(139,107,255,.08); border:1px solid rgba(139,107,255,.4); border-radius:12px; padding:11px 13px; margin-bottom:14px; }
  .advisor .face { font-size:24px; line-height:1; }
  .advisor .txt { font-size:13px; line-height:1.45; } .advisor .txt b { color:var(--accent2); }

  .goals { background:var(--panel-2); border:1px solid var(--border); border-radius:10px; padding:9px 12px; margin-bottom:14px; font-size:12px; }
  .goals .ghdr { color:var(--muted); font-weight:700; margin-bottom:3px; }
  .goals .gitem { display:inline-block; margin:2px 8px 2px 0; color:var(--muted); }
  .goals .gitem.done { color:var(--green); }

  .alloc-bar { display:flex; height:16px; border-radius:8px; overflow:hidden; border:1px solid var(--border); margin:4px 0 14px; background:#0d1320; }
  .alloc-bar > div { transition:width .15s; }
  .seg-fun{background:#ff8fb3} .seg-save{background:#5aa9ff} .seg-invest{background:#3fdd7a} .seg-cash{background:#39435a}
  .legend { display:flex; flex-wrap:wrap; gap:10px; font-size:11px; color:var(--muted); margin-bottom:14px; }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:4px; vertical-align:middle; }

  .subhead { font-size:11px; text-transform:uppercase; letter-spacing:.6px; color:var(--muted); margin:14px 0 6px; font-weight:700; }
  .alloc-row { margin-bottom:11px; }
  .alloc-row .top { display:flex; justify-content:space-between; align-items:baseline; margin-bottom:3px; }
  .alloc-row .name { font-weight:700; font-size:14px; }
  .alloc-row .name small { color:var(--muted); font-weight:400; display:block; font-size:11px; }
  .alloc-row .num { font-variant-numeric:tabular-nums; font-weight:800; }
  input[type=range] { width:100%; accent-color:var(--accent); height:22px; }
  .remaining { text-align:center; font-size:14px; color:var(--muted); margin:10px 0; }
  .remaining b { color:var(--text); font-size:17px; }

  button { font:inherit; cursor:pointer; border:1px solid var(--border); background:var(--panel-2); color:var(--text); padding:12px 16px; border-radius:12px; font-weight:700; transition:.14s; width:100%; }
  button:hover { border-color:var(--accent); transform:translateY(-2px); box-shadow:0 6px 18px rgba(139,107,255,.25); }
  button:active { transform:translateY(0); }
  button.primary { background:linear-gradient(90deg,var(--accent),var(--accent2)); border:none; color:#07101c; }
  button.gold { background:linear-gradient(90deg,#ffd24a,#ff9d3c); border:none; color:#3a2400; }
  button.ghost { background:transparent; }
  button:disabled { opacity:.4; cursor:not-allowed; transform:none; box-shadow:none; }
  .btn-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px; }
  .preset-row { display:flex; gap:8px; margin-bottom:8px; flex-wrap:wrap; }
  .preset-row button { padding:8px 12px; font-size:12px; width:auto; flex:1; }

  .market-news { font-size:16px; font-weight:700; margin-bottom:12px; }
  .big-num { font-size:32px; font-weight:800; text-align:center; margin:8px 0; font-variant-numeric:tabular-nums; }
  .center { text-align:center; }
  .pill { display:inline-block; background:var(--panel-2); border:1px solid var(--border); border-radius:999px; padding:5px 13px; font-size:12px; color:var(--muted); }
  .grade { font-size:64px; font-weight:900; line-height:1; }
  ul.tips { font-size:13px; color:var(--muted); line-height:1.7; padding-left:18px; }

  .situation-pick { display:grid; gap:10px; }
  .situation-pick button { text-align:left; padding:15px 16px; }
  .situation-pick .stitle { font-weight:800; font-size:15px; }
  .situation-pick .sdesc { color:var(--muted); font-size:12px; margin-top:3px; }
  .diff { float:right; font-size:11px; padding:2px 8px; border-radius:99px; }
  .diff.easy{background:rgba(63,221,122,.15);color:var(--green)} .diff.med{background:rgba(255,210,74,.15);color:var(--gold)} .diff.hard{background:rgba(255,107,107,.15);color:var(--red)}

  .perk-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
  .perk { flex:1 1 calc(33% - 8px); min-width:130px; text-align:left; padding:10px 12px; border-radius:12px; border:1px solid var(--border); background:var(--panel-2); cursor:pointer; transition:.14s; }
  .perk.sel { border-color:var(--accent2); box-shadow:0 0 0 2px rgba(0,212,255,.3) inset; }
  .perk.locked { opacity:.45; cursor:not-allowed; }
  .perk .pn { font-weight:800; font-size:13px; } .perk .pd { color:var(--muted); font-size:11px; margin-top:2px; }
  .locklist { font-size:12px; color:var(--muted); line-height:1.7; }
  .locklist b { color:var(--text); }

  footer { text-align:center; color:var(--muted); font-size:12px; margin:22px 0 10px; }
  canvas#chart { width:100%; height:140px; display:block; background:#0d1320; border:1px solid var(--border); border-radius:12px; }

  .opp { border:1px dashed var(--accent2); background:rgba(0,212,255,.06); border-radius:12px; padding:12px 14px; margin-bottom:14px; display:flex; align-items:center; gap:10px; justify-content:space-between; }
  .opp .txt { font-size:13px; } .opp button { width:auto; padding:8px 14px; font-size:13px; }

  .overlay { position:fixed; inset:0; background:rgba(5,8,14,.78); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:50; animation:pop .2s; padding:16px; }
  .modal { background:linear-gradient(180deg,var(--panel),#0f1420); border:1px solid var(--border); border-radius:18px; padding:22px; max-width:440px; width:100%; box-shadow:0 20px 60px rgba(0,0,0,.6); }
  .modal h3 { margin:0 0 4px; font-size:20px; } .modal .sub { color:var(--muted); font-size:13px; margin-bottom:14px; }
  #playfield { position:relative; height:280px; background:#0d1320; border:1px solid var(--border); border-radius:14px; overflow:hidden; }
  .coin { position:absolute; font-size:34px; cursor:pointer; user-select:none; transition:transform .08s; animation:coinIn .15s; }
  .coin:active { transform:scale(.8); }
  @keyframes coinIn { from{transform:scale(.3);opacity:0} to{transform:scale(1);opacity:1} }
  .mg-hud { display:flex; justify-content:space-between; font-weight:800; margin-bottom:8px; font-variant-numeric:tabular-nums; }
  .nego-track { position:relative; height:46px; background:#0d1320; border:1px solid var(--border); border-radius:10px; overflow:hidden; margin:8px 0 14px; }
  .nego-zone { position:absolute; top:0; bottom:0; background:rgba(63,221,122,.3); border-left:2px solid var(--green); border-right:2px solid var(--green); }
  .nego-marker { position:absolute; top:0; bottom:0; width:4px; background:#fff; box-shadow:0 0 8px #fff; }

  #toasts { position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; width:100%; pointer-events:none; }
  .toast { background:linear-gradient(90deg,#2a2150,#14233a); border:1px solid var(--accent); color:#fff; padding:10px 16px; border-radius:99px; font-size:13px; font-weight:700; box-shadow:0 8px 24px rgba(0,0,0,.5); animation:toastIn .3s; }
  @keyframes toastIn { from{transform:translateY(-16px);opacity:0} to{transform:none;opacity:1} }
  #confetti { position:fixed; inset:0; pointer-events:none; z-index:90; }

  .badges { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin:12px 0; }
  .badge { background:var(--panel-2); border:1px solid var(--border); border-radius:99px; padding:6px 12px; font-size:12px; }
  .stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:14px 0; text-align:left; }
  .goal-result { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .goal-result:last-child { border:none; }

  /* player bar + avatar */
  #playerbar { display:none; align-items:center; gap:10px; margin-bottom:10px; padding:8px 14px; background:linear-gradient(90deg,var(--panel),#121826); border:1px solid var(--border); border-radius:14px; }
  .pb-avatar { font-size:26px; animation:bob 2.2s ease-in-out infinite; }
  @keyframes bob { 0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-4px) rotate(2deg)} }
  .pb-name { font-weight:800; font-size:15px; }
  .pb-mood { margin-left:auto; font-size:22px; transition:transform .2s; }

  /* floating numbers */
  .floatnum { position:fixed; transform:translate(-50%,0); font-weight:900; font-size:18px; pointer-events:none; z-index:85; animation:floatup 1.1s ease-out forwards; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .floatnum.pos { color:var(--green); } .floatnum.neg { color:var(--red); }
  @keyframes floatup { 0%{opacity:0; transform:translate(-50%,4px) scale(.8)} 20%{opacity:1; transform:translate(-50%,-6px) scale(1.1)} 100%{opacity:0; transform:translate(-50%,-44px) scale(1)} }

  /* customization */
  .avatar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:8px; margin:6px 0 4px; }
  .av { font-size:24px; padding:8px 0; text-align:center; border:1px solid var(--border); border-radius:10px; background:var(--panel-2); cursor:pointer; transition:.12s; position:relative; }
  .av:hover { transform:translateY(-2px); border-color:var(--accent); }
  .av.sel { border-color:var(--accent2); box-shadow:0 0 0 2px rgba(0,212,255,.35) inset; }
  .av.locked { opacity:.32; cursor:not-allowed; filter:grayscale(1); }
  .av.locked::after { content:"🔒"; position:absolute; bottom:-2px; right:-2px; font-size:11px; }
  .name-input { width:100%; padding:11px 14px; border-radius:10px; border:1px solid var(--border); background:var(--panel-2); color:var(--text); font:inherit; font-weight:700; margin-bottom:8px; }
  .name-input:focus { outline:none; border-color:var(--accent2); }
  .theme-row { display:flex; gap:8px; flex-wrap:wrap; }
  .th { flex:1 1 calc(33% - 8px); min-width:96px; padding:9px; border-radius:10px; border:1px solid var(--border); cursor:pointer; font-size:12px; font-weight:700; text-align:center; transition:.12s; }
  .th.sel { box-shadow:0 0 0 2px rgba(0,212,255,.35) inset; }
  .th.locked { opacity:.4; cursor:not-allowed; }
  .th .sw { display:inline-block; width:34px; height:8px; border-radius:99px; margin-bottom:4px; }

  /* life-story recap */
  .story { background:linear-gradient(180deg,#1a1f2e,#10141f); border:1px solid var(--accent); border-radius:16px; padding:18px; margin:14px 0; text-align:left; }
  .story h3 { margin:0 0 4px; font-size:17px; }
  .story .line { font-size:13.5px; line-height:1.7; color:var(--text); }
  .story .line .hl { color:var(--accent2); font-weight:800; }
  .story .stamp { display:inline-block; margin-top:8px; font-size:11px; color:var(--muted); }

  /* phone polish (teens play on mobile) */
  @media (max-width:440px){
    body { padding:10px; }
    header.app h1 { font-size:28px; }
    .card { padding:16px; border-radius:14px; }
    .hud { padding:10px 8px; gap:4px; }
    .hud .stat .value { font-size:16px; }
    .avatar-grid { grid-template-columns:repeat(7,1fr); gap:5px; }
    .av { font-size:20px; padding:6px 0; }
    .preset-row button { font-size:11px; padding:7px 6px; }
    .perk { flex:1 1 calc(50% - 8px); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="app">
    <button id="mute" onclick="toggleMute()">🔊</button>
    <h1>💸 Money Path</h1>
    <p>Earn it. Budget it. Invest it. Survive 24 months — and actually enjoy life.</p>
  </header>

  <div id="progress" class="progress-wrap"><div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div></div>

  <div id="playerbar" style="display:none">
    <span id="pb-avatar" class="pb-avatar">🧑</span>
    <span id="pb-name" class="pb-name">Player</span>
    <span id="pb-mood" class="pb-mood">😄</span>
  </div>

  <div id="hud" class="hud" style="display:none">
    <div class="stat"><div class="label">Month</div><div class="value" id="hud-month">1/24</div></div>
    <div class="stat"><div class="label">Net Worth</div><div class="value" id="hud-net">$0</div></div>
    <div class="stat"><div class="label">Cash</div><div class="value" id="hud-cash">$0</div></div>
    <div class="stat"><div class="label">Happiness</div><div class="value" id="hud-happy">100</div><div class="bar"><span id="hud-happy-bar" style="width:100%"></span></div></div>
  </div>

  <div id="screen"></div>
  <footer>A mini finance game · unlock perks & new lives · beat your high score</footer>
</div>

<div id="toasts"></div>
<canvas id="confetti"></canvas>

<script>
"use strict";

// ============================ CONFIG ============================
const TOTAL_MONTHS = 24;

const SITUATIONS = [
  { id:"student", name:"🎓 College Student", income:1900, needs:1400, happy:64, diff:"easy",
    desc:"Tight income, low expenses. Forgiving — perfect for your first run." },
  { id:"gig", name:"🚗 Gig Worker", income:2500, needs:1750, happy:56, volatile:true, diff:"med",
    desc:"Income swings wildly month to month. Cash flow is your enemy." },
  { id:"pro", name:"💼 Young Professional", income:4300, needs:2950, happy:66, diff:"med",
    desc:"Good money, but lifestyle creep is real. Don't spend it all." },
  { id:"parent", name:"👨‍👧 Single Parent", income:3700, needs:3050, happy:50, diff:"hard",
    desc:"High responsibilities, razor-thin margins. Hard mode." },
];
const EXTRA_SITUATIONS = {
  entrepreneur:{ id:"entrepreneur", name:"🚀 Entrepreneur", income:3100, needs:2300, happy:60, volatile:true, diff:"hard",
    desc:"Feast-or-famine income with a high ceiling. For thrill-seekers." },
  retiree:{ id:"retiree", name:"🏖️ Retiree", income:2600, needs:2050, happy:70, diff:"med", startSavings:6000,
    desc:"Fixed pension, a big nest egg. Preserve it — and enjoy the ride." },
};

const PERKS = {
  none:        { icon:"🎯", name:"No perk",        desc:"Pure skill, no bonuses." },
  trustfund:   { icon:"💰", name:"Trust Fund",     desc:"+$2,500 starting cash." },
  frugal:      { icon:"🧾", name:"Frugal",         desc:"Your needs cost 12% less." },
  optimist:    { icon:"😌", name:"Optimist",       desc:"The daily grind hurts happiness half as much." },
  coolhead:    { icon:"🧊", name:"Cool Head",      desc:"No panic-sell loss · half the debt interest." },
  hustleredge: { icon:"💪", name:"Hustler's Edge", desc:"Side gigs & coupons pay +50%." },
  insider:     { icon:"🕵️", name:"Insider",        desc:"Fair day-trade odds · calmer markets." },
};
const PERK_ORDER = ["none","trustfund","frugal","optimist","coolhead","hustleredge","insider"];
const PERK_HINT = {
  trustfund:"Finish a run with grade A or higher",
  frugal:"Earn the 'Prepared' badge (3-month emergency fund)",
  optimist:"Finish a run at 80+ happiness",
  coolhead:"Earn 'Diamond Hands' (hold investments through a crash)",
  hustleredge:"Earn 'Side Hustler' (make money from a side hustle)",
  insider:"Earn 'High Roller' (win a day trade)",
};
const SIT_HINT = { entrepreneur:"Complete any full 24-month run", retiree:"Finish a run with grade A or higher" };

// assets: return = news.stock*mult + base + noise. Tuned (see sim) so investing
// is modest and genuinely risky — blue-chip loses money ~42% of runs, crypto ~55%.
const ASSETS = [
  { id:"bonds",      n:"🛡️ Bonds",       note:"Safe · reliable ~0.35%/mo, never crashes", mult:0.05, base:0.0035, noise:0.0025 },
  { id:"bluechip",   n:"🐢 Blue-Chip",    note:"Moderate · tracks the market, can dip",     mult:0.90, base:0.0035, noise:0.025 },
  { id:"crypto",     n:"🎢 Crypto",       note:"Wild · huge swings, often loses",           mult:1.80, base:0.005,  noise:0.090 },
  { id:"realestate", n:"🏠 Real Estate",  note:"Slow & steady · low swings",                mult:0.30, base:0.004,  noise:0.007 },
];

const EVENTS = [
  { t:"🔧 Your car broke down. Repair bill arrives.", amt:-650, kind:"bad" },
  { t:"🏥 Surprise medical bill in the mail.", amt:-900, kind:"bad" },
  { t:"🎉 You got a performance bonus at work!", amt:1100, kind:"good" },
  { t:"🧾 Tax refund hit your account.", amt:700, kind:"good" },
  { t:"📱 Your phone screen shattered.", amt:-400, kind:"bad" },
  { t:"💍 Invited to a friend's destination wedding.", amt:-450, kind:"bad" },
  { t:"🧥 You found cash in an old jacket.", amt:120, kind:"good" },
  { t:"💻 Laptop died — you need a replacement.", amt:-800, kind:"bad" },
  { t:"🎰 Won a small raffle prize.", amt:300, kind:"good" },
  { t:"🐶 Vet bill for your pet.", amt:-350, kind:"bad" },
  { t:"📦 Sold some old stuff online.", amt:250, kind:"good" },
  { t:"🅿️ Parking ticket. Ouch.", amt:-110, kind:"bad" },
  // teen-flavored life
  { t:"👟 You flipped a pair of hyped sneakers for a profit.", amt:280, kind:"good" },
  { t:"🎮 Your gaming setup needs a new part.", amt:-240, kind:"bad" },
  { t:"📸 A post blew up — a brand sent you a small sponsorship.", amt:400, kind:"good" },
  { t:"🎤 Festival tickets with friends — you couldn't say no.", amt:-300, kind:"bad" },
  { t:"💸 Grandma slipped you some birthday cash.", amt:200, kind:"good" },
  { t:"🛹 Snapped your board / cracked your screen again.", amt:-180, kind:"bad" },
  { t:"☕ You picked up extra shifts at the cafe.", amt:350, kind:"good" },
  { t:"🚗 First car needs new tires.", amt:-420, kind:"bad" },
];
const RAISE_EVENT = { t:"📈 You earned a permanent raise! Monthly income goes up.", raise:400, kind:"good" };
const CUT_EVENT = { t:"✂️ Your hours got cut. Income drops for a few months.", cut:500, months:3, kind:"bad" };

// branching dilemmas — choices with outcomes
const DILEMMAS = [
  { t:"🚀 Your friend's startup is raising money and wants $2,000 from you.",

function audio(){ if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return actx; }
function tone(freq,dur,type,vol,when){ const a=audio(); if(!a||muted) return; const o=a.createOscillator(),g=a.createGain(); o.type=type||"sine"; o.frequency.value=freq; const t=a.currentTime+(when||0); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||0.18,t+0.01); g.gain.exponentialRampToValueAtTime(0.0001,t+dur); o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur); }
function sfx(name){
  if(muted) return;
  switch(name){
    case "click": tone(420,0.05,"square",0.05); break;
    case "coin": tone(880,0.07,"square",0.10); tone(1320,0.09,"square",0.08,0.05); break;
    case "confirm": tone(523,0.09,"triangle",0.13); tone(784,0.11,"triangle",0.11,0.07); break;
    case "win": [523,659,784,1046].forEach((f,i)=>tone(f,0.17,"triangle",0.13,i*0.085)); break;
    case "bad": tone(150,0.32,"sawtooth",0.15); break;
    case "badge": tone(1046,0.09,"triangle",0.11); tone(1568,0.13,"triangle",0.09,0.08); break;
    case "lose": [440,330,220,165].forEach((f,i)=>tone(f,0.26,"sawtooth",0.14,i*0.13)); break;
  }
}

function popFloat(text, positive){

function animateNum(el,target,isMoney){
  const start=parseFloat(el.dataset.v||"0"), t0=performance.now(), dur=550;
  function step(now){ const p=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-p,3), v=start+(target-start)*e; el.textContent=isMoney?money(v):Math.round(v); if(p<1) requestAnimationFrame(step); else el.dataset.v=target; }
  el.dataset.v=start; requestAnimationFrame(step);
}
function drawChart(){
  const c=$("chart"); if(!c) return;
  const dpr=window.devicePixelRatio||1, w=c.clientWidth, h=c.clientHeight;
  c.width=w*dpr; c.height=h*dpr; const x=c.getContext("2d"); x.scale(dpr,dpr);
  const d=S.history; if(d.length<2) return;
  const min=Math.min(...d,0), max=Math.max(...d)*1.1+1;
  const px=i=>10+i*(w-20)/(d.length-1), py=v=>h-14-(v-min)/(max-min)*(h-26);
  x.strokeStyle="#243049"; x.lineWidth=1; x.beginPath(); x.moveTo(10,py(0)); x.lineTo(w-10,py(0)); x.stroke();
  const grad=x.createLinearGradient(0,0,0,h); grad.addColorStop(0,"rgba(0,212,255,.35)"); grad.addColorStop(1,"rgba(0,212,255,0)");
  x.beginPath(); x.moveTo(px(0),py(d[0])); d.forEach((v,i)=>x.lineTo(px(i),py(v))); x.lineTo(px(d.length-1),h-14); x.lineTo(px(0),h-14); x.closePath(); x.fillStyle=grad; x.fill();
  x.beginPath(); x.moveTo(px(0),py(d[0])); d.forEach((v,i)=>x.lineTo(px(i),py(v))); x.strokeStyle="#00d4ff"; x.lineWidth=2.5; x.lineJoin="round"; x.stroke();
  const li=d.length-1; x.beginPath(); x.arc(px(li),py(d[li]),4,0,7); x.fillStyle="#fff"; x.fill();
}

function confetti(){
  const c=$("confetti"), dpr=window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); const cols=["#8b6bff","#00d4ff","#3fdd7a","#ffd24a","#ff6b6b"];
  const P=Array.from({length:140},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*200,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:5+Math.random()*7,c:rand(cols),r:Math.random()*6,vr:(Math.random()-.5)*.4}));
  let f=0; (function anim(){ x.clearRect(0,0,innerWidth,innerHeight); f++; P.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=.08; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6); x.restore(); }); if(f<150) requestAnimationFrame(anim); else x.clearRect(0,0,innerWidth,innerHeight); })();
}
function moneyRain(){
  const c=$("confetti"), dpr=window.devicePixelRatio||1; c.width=innerWidth*dpr; c.height=innerHeight*dpr;
  const x=c.getContext("2d"); x.scale(dpr,dpr); const emo=["💵","💰","🤑","💎","🪙"];

  let f=0; (function anim(){ x.clearRect(0,0,innerWidth,innerHeight); f++; x.textAlign="center"; x.textBaseline="middle"; P.forEach(p=>{ p.y+=p.vy; p.r+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.r); x.font=p.s+"px serif"; x.fillText(p.e,0,0); x.restore(); }); if(f<200) requestAnimationFrame(anim); else x.clearRect(0,0,innerWidth,innerHeight); })();
}

function pickTheme(id){ META.theme=id; saveMeta(); applyTheme(id); sfx("coin"); showStart(); }

// ============================ NEW GAME ============================
function newGame(sit, perkId){
  perkId = perkId || "none";
  S = {
    sit, perk:perkId, month:1,
    income:sit.income, baseNeeds:sit.needs, needs:sit.needs,
    cash:700, savings:sit.startSavings||0,
    holdings:{bonds:0,bluechip:0,crypto:0,realestate:0},
    happy:sit.happy, cutLeft:0, discount:0,
    history:[], badges:new Set(),
    temptResisted:0, hustleEarned:0, everDebt:false, insured:false,
    goals:sampleGoals(),
    optimist:false, coolhead:false, hustleEdge:false, insider:false,
    name:(META.name&&META.name.trim())||"Player", avatar:META.avatar||"🧑",
    // life-story trackers
    story:{ bought:0, bestGain:0, bestMonth:0, worstLoss:0, worstMonth:0, crashes:0, raises:0, gigs:0, dilemmas:0, brokeMonth:0 },
  };
  if(perkId==="trustfund") S.cash+=2500;
  if(perkId==="frugal"){ S.baseNeeds=Math.round(sit.needs*0.88); S.needs=S.baseNeeds; }

  if(perkId==="coolhead") S.coolhead=true;
  if(perkId==="hustleredge") S.hustleEdge=true;
  if(perkId==="insider") S.insider=true;
  S.history=[Math.round(netWorth())];
  startMonth();
}

// ============================ MONTH START ============================
function startMonth(){
  S.discount=0;
  if(S.cash<0){ S.cash=Math.round(S.cash*(S.coolhead?1.025:1.05)); markDebt(); } // debt interest
  let inc=S.income;
  if(S.sit.volatile) inc=Math.round(S.income*(0.55+Math.random()*0.85));
  if(S.cutLeft>0){ inc-=CUT_EVENT.cut; S.cutLeft--; }
  S.thisIncome=Math.max(0,inc);

  // dilemma (28%) takes priority; otherwise normal event (55%)
  S.thisEvent=null;
  if(Math.random()<0.28){ return showDilemma(rand(DILEMMAS)); }
  if(Math.random()<0.55){
    const r=Math.random();
    if(r<0.10){ S.income+=RAISE_EVENT.raise; S.thisEvent={...RAISE_EVENT}; if(S.story)S.story.raises++; }
    else if(r<0.18 && S.cutLeft===0){ S.cutLeft=CUT_EVENT.months; S.thisEvent={...CUT_EVENT}; }
    else S.thisEvent={...rand(EVENTS)};
  }
  S.opp = Math.random()<0.5 ? rand(["hustle","trade","coupon","negotiate","memory","blitz"]) : null;
  renderBudget();
}

let _dilemmaResult=null;
function ok(msg,happy){ return {msg,happy:happy||0,fail:false}; }
function fail(msg){ return {msg,fail:true}; }
function chooseDilemma(i){
  const res=_dilemma.choices[i].run();
  if(res.fail){ toast("⚠️ "+res.msg); sfx("bad"); return; }
  S.happy=clamp(S.happy+(res.happy||0),0,100);

  markDebt();
  sfx(res.happy>0?"coin":"click");

  S.opp = Math.random()<0.5 ? rand(["hustle","trade","coupon","negotiate","memory","blitz"]) : null;

    <button class="primary" onclick="renderBudget()">Continue to budget →</button></div>`;
}

// ============================ ADVISOR ============================
function advisorTip(){
  if(S.cash<0) return "You're in <b>debt</b> — interest compounds against you. Get back to $0 before investing.";
  if(S.savings<effNeeds()) return "You've got almost no <b>emergency fund</b>. One bad month could force a fire-sale of investments — build a buffer first.";
  if(S.cash>effNeeds()*2 && invested()<500) return "You're sitting on a pile of <b>idle cash</b>. Money doing nothing slowly loses value — put some to work.";
  if(S.holdings.crypto>invested()*0.6 && invested()>1200) return "Whoa — you're heavily in <b>crypto</b>. It can crash hard. Spreading across assets smooths the ride.";
  if(S.happy<45) return "Your <b>happiness</b> is low. It's okay to budget some Fun — burnout is a real way to lose.";
  if(S.needs>S.baseNeeds*1.2) return "Your cost of living has <b>crept up</b>. Easing off big Fun spending lets it drift back down.";
  if(invested()>8000) return "Nice — your investments are <b>compounding</b>. Keep feeding them and let time work.";
  return "Looking balanced. Cover needs, hold a buffer, invest the rest, and enjoy a little.";
}

// ============================ BUDGET ============================
function renderBudget(){
  updateHUD();
  const ev=S.thisEvent;
  let evHtml=`<div class="event"><b>🌤️ A quiet month.</b> No surprises this time.</div>`;
  if(ev){ const cls=ev.kind==="good"?"good":"bad"; let a="";
    if(ev.amt) a=` <span class="amt ${ev.amt>0?'pos':'neg'}">${ev.amt>0?'+':''}${money(ev.amt)}</span>`;
    if(ev.raise) a=` <span class="amt pos">+${money(ev.raise)}/mo</span>`;
    if(ev.cut) a=` <span class="amt neg">-${money(ev.cut)}/mo · ${ev.months}mo</span>`;
    evHtml=`<div class="event ${cls}">${ev.t}${a}</div>`;
  }
  const eventCash=(ev&&ev.amt)?ev.amt:0;
  const onHand=S.cash+S.thisIncome+eventCash;
  const need=effNeeds();
  const afterNeeds=onHand-need;

  let oppHtml="";
  if(S.opp){
    const m={ hustle:["🎯","Side hustle available!","Tap fast, dodge the bombs, earn cash.","openHustle"],
              trade:["🎲","Hot stock tip!","Risk some cash on a day trade?","openTrade"],
              coupon:["🏷️","Coupon drop!","Grab discounts, avoid the scams.","openCoupon"],
              negotiate:["🤝","Raise opportunity!","3 rounds of timing for a bigger raise.","openNegotiate"],
              memory:["🧠","Brain teaser!","Repeat the market pattern for cash.","openMemory"],
              blitz:["🧮","Budget Blitz!","Answer fast finance questions for cash.","openBlitz"] }[S.opp];
    oppHtml=`<div class="opp"><span class="txt">${m[0]} <b>${m[1]}</b> ${m[2]}</span><button class="gold" onclick="${m[3]}()">Go</button></div>`;
  }

  // goals (live progress)
  const goalsHtml=`<div class="goals"><div class="ghdr">🎯 Run goals (bonus score)</div>` +
    S.goals.map(g=>`<span class="gitem ${g.check()?'done':''}">${g.check()?'✓':'◻'} ${g.d}</span>`).join("") + `</div>`;

  let html=`<div class="card"><h2>Month ${S.month} — Budget</h2>
    <div class="sub">Cover needs, keep a buffer, invest the rest, enjoy a little.</div>
    <div class="advisor"><div class="face">🤖</div><div class="txt"><b>Penny says:</b> ${advisorTip()}</div></div>
    ${evHtml}${oppHtml}${goalsHtml}
    <div class="event">💵 Income <span class="amt pos">+${money(S.thisIncome)}</span> ·
      🏠 Needs <span class="amt neg">-${money(need)}</span>
      ${S.discount>0?`<small style="color:var(--green)"> (−${money(S.discount)} coupons!)</small>`:""}
      ${S.needs>S.baseNeeds?`<small style="color:var(--gold)"> (lifestyle creep)</small>`:""}<br>
      <small style="color:var(--muted)">On hand: ${money(onHand)}${eventCash?` (incl. event ${eventCash>0?'+':''}${money(eventCash)})`:""}</small>
    </div>`;

  if(afterNeeds<0){
    html+=`<div class="event bad"><b>You can't cover your needs this month.</b> We'll drain savings, then sell investments (at a panic-sell loss), then borrow. This is exactly what an emergency fund prevents.</div>
      <button class="primary" onclick="resolveTight(${onHand})">Scrape through →</button></div>`;
    screen().innerHTML=html; return;
  }

  const max=Math.floor(afterNeeds);
  html+=`<div class="remaining">Left to allocate: <b id="left">${money(afterNeeds)}</b></div>
    <div class="alloc-bar">
      <div class="seg-fun" id="ab-fun" style="width:0"></div>
      <div class="seg-save" id="ab-save" style="width:0"></div>
      <div class="seg-invest" id="ab-invest" style="width:0"></div>
      <div class="seg-cash" id="ab-cash" style="width:100%"></div>
    </div>
    <div class="legend"><span><i class="seg-fun"></i>Fun</span><span><i class="seg-save"></i>Emergency</span><span><i class="seg-invest"></i>Invested</span><span><i class="seg-cash"></i>Cash</span></div>
    <div class="preset-row">
      <button onclick="preset('balanced',${max})">⚖️ Balanced</button>
      <button onclick="preset('saver',${max})">🛟 Saver</button>
      <button onclick="preset('investor',${max})">📈 Investor</button>
      <button onclick="preset('clear',${max})">↺ Clear</button>
    </div>
    <div class="subhead">Lifestyle & Safety</div>`;
  html+=allocRow("fun","🎉 Fun","Boosts happiness — too much causes lifestyle creep",max);
  html+=allocRow("save","🏦 Emergency Fund","Safe buffer for life's surprises",max);
  html+=`<div class="subhead">Investments — pick your mix</div>`;
  ASSETS.forEach(a=>{ html+=allocRow(a.id,a.n,a.note,max); });
  html+=`<button class="primary" onclick="confirmBudget(${afterNeeds})" style="margin-top:10px">Lock in budget →</button>
    <div class="remaining"><small>Unallocated money stays as cash (earns nothing).</small></div></div>`;
  screen().innerHTML=html;
  onSlide(max);
}
function allocRow(id,n,note,max){
  return `<div class="alloc-row"><div class="top"><span class="name">${n}<small>${note}</small></span><span class="num" id="num-${id}">$0</span></div>
    <input type="range" min="0" max="${max}" value="0" step="10" id="r-${id}" oninput="onSlide(${max})"></div>`;
}
const ALLOC_IDS = ["fun","save","bonds","bluechip","crypto","realestate"];
function preset(kind,max){
  sfx("click");
  const set=(id,f)=>{ $("r-"+id).value=Math.floor(max*f/10)*10; };
  const P={
    balanced:{fun:.22,save:.18,bonds:.12,bluechip:.22,crypto:.06,realestate:.16},
    saver:   {fun:.12,save:.42,bonds:.20,bluechip:.12,crypto:.02,realestate:.08},
    investor:{fun:.12,save:.08,bonds:.10,bluechip:.30,crypto:.18,realestate:.20},
    clear:   {fun:0,save:0,bonds:0,bluechip:0,crypto:0,realestate:0},
  }[kind];
  ALLOC_IDS.forEach(id=>set(id,P[id]));
  onSlide(max);
}
function onSlide(max){
  let total=0; const v={};
  ALLOC_IDS.forEach(id=>{ v[id]=+$("r-"+id).value; total+=v[id]; $("num-"+id).textContent=money(v[id]); });
  const left=max-total; const le=$("left"); if(le){ le.textContent=money(left); le.style.color=left<0?"var(--red)":"var(--text)"; }
  const pct=x=>max>0?Math.min(100,x/max*100):0;
  const inv=v.bonds+v.bluechip+v.crypto+v.realestate;
  $("ab-fun").style.width=pct(v.fun)+"%"; $("ab-save").style.width=pct(v.save)+"%";
  $("ab-invest").style.width=pct(inv)+"%"; $("ab-cash").style.width=Math.max(0,pct(left))+"%";
}
function confirmBudget(afterNeeds){
  const g=id=>+$("r-"+id).value;
  const v={}; let total=0; ALLOC_IDS.forEach(id=>{ v[id]=g(id); total+=v[id]; });
  if(total>afterNeeds+0.5){ toast("⚠️ You allocated more than you have"); shake(); sfx("bad"); return; }
  sfx("confirm");
  const ev=S.thisEvent; const eventCash=(ev&&ev.amt)?ev.amt:0;
  S.cash = S.cash + S.thisIncome + eventCash - effNeeds() - total;
  S.savings += v.save;
  S.holdings.bonds+=v.bonds; S.holdings.bluechip+=v.bluechip; S.holdings.crypto+=v.crypto; S.holdings.realestate+=v.realestate;
  markDebt();

  // happiness
  let dH = S.optimist ? -1.5 : -3;
  dH += 16*(1-Math.exp(-v.fun/420));
  if(S.savings<effNeeds()) dH-=2;
  if(S.cash<0) dH-=5;
  S.happy=clamp(S.happy+dH,0,100);

  // lifestyle creep
  const funRatio=S.thisIncome>0?v.fun/S.thisIncome:0;
  if(funRatio>0.5){ const b=S.needs; S.needs=Math.min(Math.round(S.needs*1.05),Math.round(S.baseNeeds*1.7)); if(S.needs>b) toast("📈 Lifestyle creep: your needs went up"); }
  else if(funRatio<0.2 && S.needs>S.baseNeeds){ S.needs=Math.max(Math.round(S.needs*0.98),S.baseNeeds); }

  if(invested()>=10000) unlock("invested","Five-Figure Investor");
  if(S.savings>=effNeeds()*3) unlock("prepared","Prepared (3-month fund)");
  goTemptation();
}
function resolveTight(onHand){
  S.cash=0; let deficit=effNeeds()-onHand;
  const fromSave=Math.min(S.savings,deficit); S.savings-=fromSave; deficit-=fromSave;
  if(deficit>0){
    const sellable=invested();
    if(sellable>0){
      const lossFactor=S.coolhead?1:0.95;
      const take=Math.min(sellable,deficit/lossFactor);
      const f=take/sellable;
      ASSETS.forEach(a=>{ S.holdings[a.id]-=S.holdings[a.id]*f; });
      deficit-=take*lossFactor;
    }
  }
  if(deficit>0){ S.cash-=deficit; markDebt(); }
  S.happy=clamp(S.happy-(S.insured?7:12),0,100);
  sfx("bad"); shake(); toast("😣 No buffer — you took a hit");
  goTemptation();
}

// ============================ TEMPTATION ============================
function goTemptation(){
  updateHUD();
  if(Math.random()>0.6 || S.cash<120) return goMarket();
  const t=rand(TEMPTATIONS); S.tempt=t; const afford=S.cash>=t.cost;
  screen().innerHTML=`<div class="card"><h2>💳 Temptation!</h2>
    <div class="sub">A little dopamine now... or let that money compound for future you?</div>
    <div class="event">${t.t}<br><span class="amt neg">-${money(t.cost)}</span> · happiness <span class="amt pos">+${t.joy}</span></div>
    <div class="remaining">Your cash: <b>${money(S.cash)}</b></div>
    <div class="btn-row"><button class="ghost" onclick="declineTempt()">Resist 🧘</button>
    <button class="primary" onclick="buyTempt()" ${afford?"":"disabled"}>${afford?"Treat myself 🛍️":"Can't afford"}</button></div></div>`;
}
function buyTempt(){ const t=S.tempt; S.cash-=t.cost; S.happy=clamp(S.happy+t.joy,0,100); if(S.story)S.story.bought++; sfx("coin"); markDebt(); goMarket(); }
function declineTempt(){ S.happy=clamp(S.happy-1,0,100); S.temptResisted++; sfx("click"); if(S.temptResisted>=5) unlock("zen","Master of Restraint"); goMarket(); }

// ============================ MARKET ============================
function goMarket(){
  updateHUD();
  const news=rand(NEWS); const nz=S.insider?0.5:1;
  const before={}; ASSETS.forEach(a=>before[a.id]=S.holdings[a.id]);
  ASSETS.forEach(a=>{ const ret=news.stock*a.mult+a.base+(Math.random()-0.5)*2*a.noise*nz; S.holdings[a.id]=Math.max(0,S.holdings[a.id]*(1+ret)); });
  S.savings*=1.0015;
  const riskyBefore=before.bluechip+before.crypto+before.realestate;
  if(news.crash && riskyBefore>0){ unlock("diamond","Diamond Hands (held a crash)"); if(S.story)S.story.crashes++; }
  // story: best/worst single-month investment swing
  const invDelta = ASSETS.reduce((s,a)=>s+(S.holdings[a.id]-before[a.id]),0);
  if(S.story){ if(invDelta>S.story.bestGain){ S.story.bestGain=invDelta; S.story.bestMonth=S.month; } if(invDelta<S.story.worstLoss){ S.story.worstLoss=invDelta; S.story.worstMonth=S.month; } }

  let body;
  if(invested()===0 && riskyBefore===0 && before.bonds===0){
    body=`<div class="event">You have nothing invested, so the market doesn't touch your money.<br><small style="color:var(--muted)">Investing is how money grows while you sleep — try putting some in next month.</small></div>`;
  } else {
    body=`<div class="event">`;
    ASSETS.forEach(a=>{ if(before[a.id]>0){ const d=S.holdings[a.id]-before[a.id]; body+=`${a.n}: ${money(before[a.id])} → <b>${money(S.holdings[a.id])}</b> <span class="amt ${d>=0?'pos':'neg'}">(${d>=0?'+':''}${money(d)})</span><br>`; } });
    body+=`</div>`;
  }
  S.history.push(Math.round(netWorth()));
  const last=S.history[S.history.length-1], prev=S.history[S.history.length-2]||last;
  if(last>=prev) sfx("coin"); else sfx("bad");
  if(Math.abs(invDelta)>=20) popFloat((invDelta>=0?"+":"")+money(invDelta), invDelta>=0);

  screen().innerHTML=`<div class="card"><h2>📰 Market Report — Month ${S.month}</h2>
    <div class="market-news">${news.t}</div>${body}
    <canvas id="chart"></canvas>
    <div class="big-num">${money(netWorth())}</div>
    <div class="center sub" style="margin:-4px 0 12px">net worth</div>
    <button class="primary" onclick="endMonth()">${S.month>=TOTAL_MONTHS?"See final results 🏁":"Next month →"}</button></div>`;
  updateHUD(); drawChart();
}
function endMonth(){
  if(S.happy<=0) return gameOver("burnout");
  if(S.cash<-3500) return gameOver("debt");
  if(S.month>=TOTAL_MONTHS) return showResults();
  S.month++; startMonth();
}

  }
  function end(){ clearInterval(timer); clearInterval(spawner); S.discount=saved; if(saved>0) sfx("win");
    $("playfield").parentElement.innerHTML=`<h3>Time! ✂️</h3><div class="sub">This month's needs reduced by</div><div class="big-num" style="color:var(--green)">${money(saved)}</div><button class="primary" onclick="closeOv()">Back to budget →</button>`;
  }
}
// Day Trade — risky bet
function openTrade(){
  S.opp=null; sfx("click"); if(S.story)S.story.gigs++; const maxStake=Math.min(800,Math.max(0,Math.floor(S.cash)));
  openOverlay(`<h3>🎲 Day Trade</h3><div class="sub">Bet on the next tick. Win pays <b>1.9×</b>, but it's a coin flip — the odds quietly favor losing. (That's the lesson 😉)${S.insider?"<br><b style='color:var(--accent2)'>Insider perk: fair 50/50 odds.</b>":""}</div>
    <div class="mg-hud"><span>Stake</span><span id="t-stake">$0</span></div>
    <input type="range" min="0" max="${maxStake}" step="20" value="0" id="t-range" oninput="$('t-stake').textContent=money(+this.value)" style="width:100%">
    <div class="btn-row" style="margin-top:14px"><button onclick="doTrade(true)">📈 Bet UP</button><button onclick="doTrade(false)">📉 Bet DOWN</button></div>
    <button class="ghost" style="margin-top:8px" onclick="closeOv()">Walk away</button>`);
}
function doTrade(betUp){
  const stake=+$("t-range").value; if(stake<=0){ toast("Pick a stake first"); return; }
  const wentUp=Math.random()<(S.insider?0.5:0.45); const win=(betUp===wentUp);
  S.cash-=stake; if(win){ S.cash+=Math.round(stake*1.9); unlock("roller","High Roller"); sfx("win"); } else { sfx("bad"); }
  markDebt();
  $("ov").querySelector(".modal").innerHTML=`<h3>${win?"📈 You won! 🎉":"📉 You lost"}</h3>
    <div class="sub">Market went ${wentUp?"UP":"DOWN"}.</div>
    <div class="big-num" style="color:${win?'var(--green)':'var(--red)'}">${win?"+"+money(stake*0.9):"-"+money(stake)}</div>
    <button class="primary" onclick="closeOv()">Back to budget →</button>`;
  if(win) confetti();
}
// Salary Negotiation — 3 rounds, shrinking zone, faster marker
let _nego=null;
function openNegotiate(){
  S.opp=null; sfx("click"); if(S.story)S.story.gigs++;
  _nego={ round:0, total:0, raf:null, pos:0, dir:1, rounds:[{w:22,speed:1.7},{w:15,speed:2.3},{w:10,speed:2.9}] };
  openOverlay(`<h3>🤝 Salary Negotiation</h3><div class="sub">Three rounds — stop the marker in the green zone each time. It shrinks and speeds up. Clear all three for the biggest raise!</div>
    <div class="mg-hud"><span>Round <span id="ng-round">1</span>/3</span><span>📈 <span id="ng-raise">+$0</span>/mo</span></div>
    <div class="nego-track"><div class="nego-zone" id="ng-zone"></div><div class="nego-marker" id="ng-marker" style="left:0%"></div></div>
    <button class="gold" id="ng-btn" onclick="negoStop()">STOP!</button>
    <button class="ghost" style="margin-top:8px" onclick="negoBail()">Take current raise & leave</button>`);
  negoStart();
}
function negoStart(){
  const r=_nego.rounds[_nego.round]; const zoneL=50-r.w/2;
  _nego.zoneL=zoneL; _nego.zoneW=r.w; _nego.pos=0; _nego.dir=1;
  $("ng-round").textContent=_nego.round+1;
  const zone=$("ng-zone"); zone.style.left=zoneL+"%"; zone.style.width=r.w+"%";
  const marker=$("ng-marker");
  function loop(){ _nego.pos+=_nego.dir*r.speed; if(_nego.pos>=100){_nego.pos=100;_nego.dir=-1;} if(_nego.pos<=0){_nego.pos=0;_nego.dir=1;} marker.style.left=_nego.pos+"%"; _nego.raf=requestAnimationFrame(loop); }
  loop();
}
function negoStop(){
  if(_nego.raf) cancelAnimationFrame(_nego.raf);
  const pos=_nego.pos, zoneL=_nego.zoneL, zoneW=_nego.zoneW, center=zoneL+zoneW/2;
  if(pos>=zoneL && pos<=zoneL+zoneW){
    const closeness=1-Math.abs(pos-center)/(zoneW/2);
    _nego.total+=Math.round(110+closeness*180); $("ng-raise").textContent="+"+money(_nego.total);
    sfx("coin"); _nego.round++;
    if(_nego.round>=3) return negoFinish(true);
    setTimeout(negoStart,400);
  } else { negoFinish(false); }
}
function negoBail(){ if(_nego.raf) cancelAnimationFrame(_nego.raf); negoFinish(null); }
function negoFinish(perfect){
  if(_nego.raf) cancelAnimationFrame(_nego.raf);
  const raise=_nego.total; if(raise>0){ S.income+=raise; unlock("negotiator","Smooth Talker"); if(S.story)S.story.raises++; }
  if(perfect===true){ confetti(); sfx("win"); } else if(raise>0){ sfx("confirm"); } else { sfx("bad"); S.happy=clamp(S.happy-2,0,100); }
  const head = perfect===true?"🎉 Flawless negotiation!" : raise>0?"🤝 Deal closed" : "😬 Negotiation fell apart";
  $("ov").querySelector(".modal").innerHTML=`<h3>${head}</h3><div class="sub">Permanent raise</div><div class="big-num" style="color:${raise>0?'var(--green)':'var(--red)'}">+${money(raise)}/mo</div><button class="primary" onclick="closeOv()">Back to budget →</button>`;
}
// Market Pattern — Simon-style memory, gets longer each round
function openMemory(){
  S.opp=null; sfx("click"); if(S.story)S.story.gigs++;
  const ICONS=["🛡️","🐢","🎢","🏠"];
  let seq=[], round=0, earned=0, accepting=false, input=[];
  openOverlay(`<h3>🧠 Market Pattern</h3><div class="sub">Watch the sequence, then repeat it. Each round adds one more — a single slip ends it, so bank what you can!</div>
    <div class="mg-hud"><span>Round <span id="mg-round">1</span></span><span>💰 <span id="mg-earn">$0</span></span></div>
    <div id="memgrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px"></div>
    <div id="memstatus" class="center sub" style="margin-top:10px">Get ready...</div>`);
  const grid=$("memgrid"); const btns={};
  ICONS.forEach(ic=>{ const b=document.createElement("button"); b.textContent=ic; b.style.fontSize="32px"; b.style.padding="18px"; b.disabled=true; b.onclick=()=>handle(ic); grid.appendChild(b); btns[ic]=b; });
  function flash(ic,on){ btns[ic].style.background=on?"var(--accent2)":"var(--panel-2)"; btns[ic].style.transform=on?"scale(1.04)":"none"; }
  function nextRound(){
    round++; $("mg-round").textContent=round; input=[]; accepting=false;
    ICONS.forEach(ic=>btns[ic].disabled=true);
    seq.push(ICONS[Math.floor(Math.random()*4)]);
    $("memstatus").textContent="Watch...";
    let i=0; const speed=Math.max(360,640-round*30);
    const iv=setInterval(()=>{
      if(i>0) flash(seq[i-1],false);
      if(i>=seq.length){ clearInterval(iv); accepting=true; ICONS.forEach(ic=>btns[ic].disabled=false); $("memstatus").textContent="Your turn!"; return; }
      flash(seq[i],true); sfx("click"); i++;
    }, speed);
  }
  function handle(ic){
    if(!accepting) return;
    input.push(ic); flash(ic,true); setTimeout(()=>flash(ic,false),130);
    const idx=input.length-1;
    if(input[idx]!==seq[idx]) return end(false);
    if(input.length===seq.length){
      earned+=Math.round((35+round*25)*mgMult()); $("mg-earn").textContent=money(earned); sfx("coin");
      accepting=false; ICONS.forEach(ic=>btns[ic].disabled=true); setTimeout(nextRound,650);
    }
  }
  function end(){
    accepting=false; ICONS.forEach(ic=>btns[ic].disabled=true);
    S.cash+=earned; S.hustleEarned+=earned; if(earned>=250) unlock("brainiac","Pattern Master");
    sfx(earned>0?"win":"bad");
    $("ov").querySelector(".modal").innerHTML=`<h3>❌ Missed it! 🧠</h3><div class="sub">You banked</div><div class="big-num" style="color:var(--green)">${money(earned)}</div><button class="primary" onclick="closeOv()">Back to budget →</button>`;
  }
  setTimeout(nextRound,500);
}
// Budget Blitz — quick finance math under a timer
function openBlitz(){
  S.opp=null; sfx("click"); if(S.story)S.story.gigs++;
  const Q=[]; for(let i=0;i<4;i++) Q.push(genQ());
  function genQ(){
    const type=Math.floor(Math.random()*3); let text,ans;
    if(type===0){ const inc=Math.round((1500+Math.random()*2500)/50)*50, sp=Math.round((400+Math.random()*1000)/50)*50; text=`Income $${inc.toLocaleString()} − spending $${sp.toLocaleString()} = ?`; ans=inc-sp; }
    else if(type===1){ const p=Math.round((400+Math.random()*1600)/50)*50, r=[5,10,15,20][Math.floor(Math.random()*4)]; text=`What is ${r}% of $${p.toLocaleString()}?`; ans=Math.round(p*r/100); }
    else { const a=Math.round((300+Math.random()*800)/10)*10, b=Math.round((200+Math.random()*600)/10)*10, c=Math.round((100+Math.random()*400)/10)*10; text=`Add the bills: $${a} + $${b} + $${c} = ?`; ans=a+b+c; }
    const opts=new Set([ans]); let guard=0;
    while(opts.size<4 && guard++<40){ const d=Math.round((ans+(Math.random()-0.5)*Math.max(80,ans*0.35))/10)*10; if(d>0 && d!==ans) opts.add(d); }
    return { text, ans, opts:[...opts].sort(()=>Math.random()-0.5) };
  }
  let qi=0, correct=0, time=6, timer=null;
  openOverlay(`<h3>🧮 Budget Blitz</h3><div class="sub">Answer fast — each question is on a clock. Every correct answer pays out.</div>
    <div class="mg-hud"><span>Q <span id="bz-q">1</span>/4</span><span>⏱️ <span id="bz-time">6</span>s</span></div>
    <div id="bz-text" class="event" style="font-size:16px;text-align:center"></div>
    <div id="bz-opts"></div>`);
  function show(){
    if(qi>=Q.length) return end();
    time=6; $("bz-q").textContent=qi+1; $("bz-time").textContent=time;
    const q=Q[qi]; $("bz-text").textContent=q.text;
    const wrap=$("bz-opts"); wrap.innerHTML="";
    q.opts.forEach(o=>{ const b=document.createElement("button"); b.textContent="$"+o.toLocaleString(); b.style.marginBottom="8px"; b.onclick=()=>answer(o); wrap.appendChild(b); });
    clearInterval(timer); timer=setInterval(()=>{ time--; $("bz-time").textContent=time; if(time<=0) answer(null); },1000);
  }
  function answer(o){
    clearInterval(timer); const q=Q[qi];
    if(o===q.ans){ correct++; sfx("coin"); } else sfx("bad");
    qi++; show();
  }
  function end(){
    const earned=Math.round(correct*115*mgMult()); S.cash+=earned; S.hustleEarned+=earned;
    if(correct===4) unlock("mathwhiz","Numbers Whiz");
    sfx(earned>0?"win":"bad");
    $("ov").querySelector(".modal").innerHTML=`<h3>🧮 ${correct}/4 correct</h3><div class="sub">You earned</div><div class="big-num" style="color:var(--green)">${money(earned)}</div><button class="primary" onclick="closeOv()">Back to budget →</button>`;
  }
  show();
}

// ============================ ENDINGS ============================
function gameOver(reason){
  sfx("lose");
  const map={ burnout:["😵 Burnout","Your happiness hit zero. All money and no joy is a losing game — money is a tool, not the goal."],
              debt:["💀 Buried in debt","Your debt spiraled out of control. Cash flow — not net worth — is what sinks people first."] };
  const [title,msg]=map[reason];
  screen().innerHTML=`<div class="card center"><div class="grade">💔</div><h2>${title}</h2>
    <div class="sub">${msg}</div><div class="pill">Reached month ${S.month} of ${TOTAL_MONTHS}</div>
    <div style="height:14px"></div><button class="primary" onclick="showStart()">Try again →</button></div>`;
}

// build a shareable, screenshot-worthy life-story recap
function buildStory(grade){
  const st=S.story||{bought:0,gigs:0,raises:0,crashes:0,bestGain:0,worstLoss:0,bestMonth:0,worstMonth:0,brokeMonth:0};
  const role=S.sit.name.replace(/^\S+\s/,"");
  const L=[];
  L.push(`<span class="hl">${S.avatar} ${S.name}</span> spent 24 months living as a ${role}.`);
  if(st.bought>=6) L.push(`You gave in to <span class="hl">${st.bought}</span> temptations — hey, life's for living.`);
  else if(st.bought===0 && S.temptResisted>0) L.push(`You resisted <span class="hl">every single</span> temptation. Iron will. 🧘`);
  else L.push(`You treated yourself <span class="hl">${st.bought}</span> time${st.bought===1?'':'s'} and resisted <span class="hl">${S.temptResisted}</span>.`);
  if(st.gigs>0) L.push(`You grinded <span class="hl">${st.gigs}</span> side gig${st.gigs===1?'':'s'}, pocketing <span class="hl">${money(S.hustleEarned)}</span>.`);
  if(st.raises>0) L.push(`You landed <span class="hl">${st.raises}</span> raise${st.raises===1?'':'s'} along the way. 📈`);
  if(st.crashes>0) L.push(`You held your nerve through <span class="hl">${st.crashes}</span> market crash${st.crashes===1?'':'es'}. 💎`);
  if(st.bestGain>=50) L.push(`Best month: the market handed you <span class="hl">+${money(st.bestGain)}</span> (month ${st.bestMonth}).`);
  if(st.worstLoss<=-50) L.push(`Worst month: you watched <span class="hl">${money(st.worstLoss)}</span> vanish (month ${st.worstMonth}). 😬`);
  if(st.brokeMonth) L.push(`You slipped into debt around month <span class="hl">${st.brokeMonth}</span> — but kept fighting.`);
  const mood=S.happy>=75?"genuinely happy":S.happy>=50?"doing just fine":S.happy>=30?"a little burnt out":"running on empty";
  L.push(`You finished with <span class="hl">${money(netWorth())}</span> to your name, ${mood}.`);
  L.push(`<b>${ {S:"A legendary run. 🏆",A:"An amazing run. 🌟",B:"A solid run. ✅",C:"A decent run. 🙂",D:"A bumpy run. 😬",F:"A run to learn from. 🥵"}[grade] }</b>`);
  return L;
}

function showResults(){
  const nw=netWorth(), h=S.happy;
  const base=Math.max(0,Math.round(nw*(h/100)));
  // goal bonuses
  let goalBonus=0; const goalRows=S.goals.map(g=>{ const met=g.check(); if(met) goalBonus+=g.bonus; return {d:g.d,met,bonus:g.bonus}; });
  const score=base+goalBonus;

  let grade,emoji,blurb;
  if(score>30000){grade="S";emoji="🏆";blurb="Financial wizard — wealthy AND happy. The dream run.";}
  else if(score>19000){grade="A";emoji="🌟";blurb="Excellent balance of growth and life. Very strong.";}
  else if(score>11000){grade="B";emoji="✅";blurb="Solid — you built wealth without losing yourself.";}
  else if(score>5000){grade="C";emoji="🙂";blurb="Decent. Room to invest more — or enjoy life more.";}
  else if(score>700){grade="D";emoji="😬";blurb="You survived, but barely grew. Invest earlier next time.";}
  else {grade="F";emoji="🥵";blurb="Rough run — build an emergency fund and invest sooner.";}

  // meta unlocks
  const newly=checkUnlocks(grade,score);

  const tips=[];
  if(invested()<nw*0.25) tips.push("Most of your money sat in cash — invested money compounds and grows far faster.");
  if(h<45) tips.push("Your happiness was low. All-out saving isn't 'winning' if you're miserable — budget some fun.");
  if(h>85 && nw<11000) tips.push("You enjoyed life but under-invested. A little discipline early goes a long way thanks to compounding.");
  if(S.savings<S.baseNeeds) tips.push("Aim for an emergency fund of ~3 months of needs to absorb surprises.");
  if(S.needs>S.baseNeeds*1.2) tips.push("Lifestyle creep inflated your costs — raising spending is easy, lowering it is hard.");
  if(ASSETS.filter(a=>S.holdings[a.id]>0).length<=1 && invested()>0) tips.push("You concentrated in one asset — diversifying spreads your risk.");
  if(!tips.length) tips.push("Great instincts — you balanced spending, saving, and investing beautifully.");

  if(grade==="S"||grade==="A"){ confetti(); moneyRain(); sfx("win"); } else sfx("confirm");

  const storyLines=buildStory(grade);
  const storyHtml=`<div class="story"><h3>📖 ${S.name}'s Money Story</h3>${storyLines.map(l=>`<div class="line">${l}</div>`).join("")}<div class="stamp">Money Path · ${S.sit.name} · Score ${score.toLocaleString()} · Grade ${grade}</div></div>`;
  const badges=[...S.badges].length?`<div class="badges">${[...S.badges].map(b=>`<span class="badge">🏅 ${badgeName(b)}</span>`).join("")}</div>`:"";
  const unlockHtml=newly.length?`<div class="event good"><b>🔓 Unlocked:</b> ${newly.join(" · ")} — try them on your next run!</div>`:"";
  const bestHtml=score>=META.best?`<div class="pill" style="background:rgba(255,210,74,.15);color:var(--gold)">🔥 New best score!</div>`:`<div class="pill">Best: ${META.best.toLocaleString()}</div>`;

  screen().innerHTML=`<div class="card center">
    <div class="pill">${S.avatar} ${S.name} · ${S.sit.name} · ${PERKS[S.perk].icon} ${PERKS[S.perk].name}</div>
    <div class="grade" style="color:var(--gold)">${emoji} ${grade}</div>
    <div class="big-num" id="score-anim">0</div>
    <div class="center sub" style="margin:-4px 0 8px">final score${goalBonus?` (incl. +${goalBonus.toLocaleString()} goal bonus)`:""}</div>
    <div style="margin-bottom:10px">${bestHtml}</div>
    <div class="sub">${blurb}</div>
    ${unlockHtml}
    <canvas id="chart"></canvas>
    <div class="stat-grid">
      <div class="event">Net worth<br><b style="font-size:18px">${money(nw)}</b></div>
      <div class="event">Happiness<br><b style="font-size:18px">${Math.round(h)}/100</b></div>
      <div class="event">Invested<br><b>${money(invested())}</b></div>
      <div class="event">Emergency fund<br><b>${money(S.savings)}</b></div>
    </div>
    ${storyHtml}
    <div style="text-align:left;margin-bottom:12px"><b>🎯 Goals</b>
      ${goalRows.map(g=>`<div class="goal-result"><span style="color:${g.met?'var(--green)':'var(--muted)'}">${g.met?'✓':'✗'} ${g.d}</span><span class="amt ${g.met?'pos':''}" style="color:${g.met?'var(--green)':'var(--muted)'}">${g.met?'+'+g.bonus.toLocaleString():'—'}</span></div>`).join("")}
    </div>
    ${badges}
    <div style="text-align:left"><b>💡 Takeaways</b><ul class="tips">${tips.map(t=>`<li>${t}</li>`).join("")}</ul></div>
    <div class="btn-row"><button class="ghost" onclick="showStart()">New life</button><button class="primary" onclick="newGame(S.sit, S.perk)">Replay →</button></div>
  </div>`;
  drawChart();
  const el=$("score-anim"); const t0=performance.now();
  (function step(now){ const p=Math.min(1,(now-t0)/1000), e=1-Math.pow(1-p,3); el.textContent=Math.round(score*e).toLocaleString(); if(p<1) requestAnimationFrame(step); })(performance.now());
}

function checkUnlocks(grade,score){
  const newly=[];
  const add=(arr,id,label)=>{ if(!arr.includes(id)){ arr.push(id); newly.push(label); } };
  add(META.sits,"entrepreneur",EXTRA_SITUATIONS.entrepreneur.name);
  if(grade==="S"||grade==="A"){ add(META.sits,"retiree",EXTRA_SITUATIONS.retiree.name); add(META.perks,"trustfund",PERKS.trustfund.icon+" "+PERKS.trustfund.name); }
  if(S.badges.has("prepared")) add(META.perks,"frugal",PERKS.frugal.icon+" "+PERKS.frugal.name);
  if(S.badges.has("hustler")) add(META.perks,"hustleredge",PERKS.hustleredge.icon+" "+PERKS.hustleredge.name);
  if(S.badges.has("diamond")) add(META.perks,"coolhead",PERKS.coolhead.icon+" "+PERKS.coolhead.name);
  if(S.badges.has("roller")) add(META.perks,"insider",PERKS.insider.icon+" "+PERKS.insider.name);
  if(S.happy>=80) add(META.perks,"optimist",PERKS.optimist.icon+" "+PERKS.optimist.name);
  // cosmetic unlocks (avatars + themes)
  add(META.themes,"sunset","🎨 Sunset theme");
  if(S.badges.has("prepared")) add(META.themes,"mint","🎨 Mint theme");
  if(S.badges.has("invested")) add(META.avatars,"🤖","🤖 Robot avatar");
  if(S.badges.has("roller")) add(META.avatars,"👽","👽 Alien avatar");
  if(score>=15000) add(META.avatars,"🔥","🔥 Fire avatar");
  if(score>=20000) add(META.themes,"goldrush","🎨 Gold Rush theme");
  if(score>=25000) add(META.avatars,"👑","👑 Crown avatar");
  if(grade==="S"||grade==="A"){ add(META.avatars,"🦄","🦄 Unicorn avatar"); add(META.themes,"vapor","🎨 Vaporwave theme"); }
  if(grade==="S") add(META.avatars,"🐉","🐉 Dragon avatar");
  S.badges.forEach(b=>{ if(!META.badges.includes(b)) META.badges.push(b); });
  META.runs=(META.runs||0)+1;
  if(score>META.best) META.best=score;
  saveMeta();
  return newly;
}
function badgeName(id){
  return { invested:"Five-Figure Investor", prepared:"Prepared", zen:"Master of Restraint", diamond:"Diamond Hands", hustler:"Side Hustler", roller:"High Roller", negotiator:"Smooth Talker", brainiac:"Pattern Master", mathwhiz:"Numbers Whiz" }[id]||id;
}

// boot
applyTheme(META.theme);
showStart();
window.addEventListener("resize", ()=>{ if($("chart")) drawChart(); });
</script>
